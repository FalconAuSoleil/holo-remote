<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="base" cx=".4" cy=".3" r=".9">
      <stop offset="0" stop-color="#f1fbff"/>
      <stop offset=".45" stop-color="#a9dcff"/>
      <stop offset="1" stop-color="#2a82f0"/>
    </radialGradient>
    <linearGradient id="deep" x1="0" y1=".35" x2="0" y2="1">
      <stop offset="0" stop-color="#1a63e6" stop-opacity="0"/>
      <stop offset=".75" stop-color="#0f4fdc" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0a3fc4"/>
    </linearGradient>
    <radialGradient id="gloss" cx=".35" cy=".2" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <clipPath id="ball"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#base)"/>
  <g clip-path="url(#ball)">
    <circle cx="32" cy="32" r="30" fill="url(#deep)"/>
    <g filter="url(#soft)" fill="#fff">
      <ellipse cx="22" cy="30" rx="15" ry="5.5" opacity=".95"/>
      <ellipse cx="40" cy="25" rx="13" ry="4.5" opacity=".85"/>
      <ellipse cx="34" cy="37" rx="16" ry="4" opacity=".7"/>
      <ellipse cx="18" cy="21" rx="9" ry="3.5" opacity=".7"/>
    </g>
    <ellipse cx="25" cy="16" rx="14" ry="9" fill="url(#gloss)"/>
  </g>
</svg>
