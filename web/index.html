<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilote</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#667; --card:#f2f3f6; --accent:#2457ff; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0f13; --fg:#eee; --muted:#9aa; --card:#1a1c23; --accent:#6b8cff; --bad:#ef5350; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; min-height:100dvh; display:flex; flex-direction:column; padding:16px; gap:12px; }
  h1 { font-size:18px; margin:0; display:flex; justify-content:space-between; align-items:center; }
  .dot { font-size:13px; color:var(--muted); } .dot.on { color:#2e9e4f; }
  #join { display:flex; gap:8px; } input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--muted); background:var(--card); color:var(--fg); font:inherit; }
  button { padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; }
  button.ghost { background:var(--card); color:var(--fg); }
  #log { flex:1; overflow:auto; display:flex; flex-direction:column; gap:8px; }
  .m { background:var(--card); padding:10px 12px; border-radius:10px; white-space:pre-wrap; }
  .m.me { background:var(--accent); color:#fff; align-self:flex-end; } .m.err { color:var(--bad); } .m.partial { opacity:.6; }
  #ptt { height:84px; font-size:18px; touch-action:none; user-select:none; -webkit-user-select:none; }
  #ptt.rec { background:var(--bad); }
  #bar { display:flex; gap:8px; } [hidden] { display:none !important; }
</style>
</head>
<body>
<h1>Pilote <span id="pc" class="dot">PC : hors ligne</span></h1>
<form id="join"><input id="code" placeholder="Code de session" autocapitalize="off" autocomplete="off" maxlength="10"><button>Rejoindre</button></form>
<div id="log" hidden></div>
<div id="bar" hidden>
  <input id="txt" placeholder="Ou écris une instruction"><button id="send" class="ghost">Envoyer</button><button id="stop" class="ghost">Stop</button>
</div>
<button id="ptt" hidden>Maintiens pour parler</button>
<script>
const $ = (id) => document.getElementById(id);
let ws, stream, ctx, proc, recording = false, partialEl = null;

const add = (text, cls = "") => { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text; $("log").append(d); $("log").scrollTop = 1e9; return d; };

function connect(code) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?role=phone&session=${encodeURIComponent(code)}`);
  ws.onopen = () => { localStorage.setItem("pilote-code", code); for (const id of ["log", "bar", "ptt"]) $(id).hidden = false; $("join").hidden = true; };
  ws.onclose = () => { $("pc").textContent = "PC : hors ligne"; $("pc").className = "dot"; setTimeout(() => connect(code), 2000); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "pc") { $("pc").textContent = m.connected ? "PC : connecté" : "PC : hors ligne"; $("pc").className = "dot" + (m.connected ? " on" : ""); }
    else if (m.type === "partial") { partialEl ??= add("", "me partial"); partialEl.textContent = m.text; }
    else if (m.type === "transcript") { partialEl?.remove(); partialEl = null; add(m.text, "me"); }
    else if (m.type === "agent") add((m.event.kind === "error" ? "Erreur : " : "") + m.event.text, m.event.kind === "error" ? "err" : "");
    else if (m.type === "error") add(m.text, "err");
  };
}

const send = (o) => ws?.readyState === 1 && ws.send(JSON.stringify(o));

async function startRec() {
  if (recording) return; recording = true; $("ptt").classList.add("rec");
  try {
    stream ??= await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true } });
  } catch { recording = false; $("ptt").classList.remove("rec"); return add("Micro refusé ou indisponible (HTTPS requis).", "err"); }
  if (!recording) return;
  ctx ??= new AudioContext();
  const src = ctx.createMediaStreamSource(stream);
  proc = ctx.createScriptProcessor(4096, 1, 1);
  const ratio = ctx.sampleRate / 16000;
  proc.onaudioprocess = (e) => {
    if (!recording) return;
    const input = e.inputBuffer.getChannelData(0), n = Math.floor(input.length / ratio), out = new Int16Array(n);
    for (let i = 0; i < n; i++) { const s = input[Math.floor(i * ratio)]; out[i] = Math.max(-1, Math.min(1, s)) * 0x7fff; }
    ws.send(out.buffer);
  };
  src.connect(proc); proc.connect(ctx.destination);
  proc._src = src;
  send({ type: "voice-start" });
}
function stopRec() {
  if (!recording) return; recording = false; $("ptt").classList.remove("rec");
  proc?.disconnect(); proc?._src?.disconnect(); proc = null;
  send({ type: "voice-end" });
}

$("join").onsubmit = (e) => { e.preventDefault(); const c = $("code").value.trim().toLowerCase(); if (c) connect(c); };
$("send").onclick = () => { const t = $("txt").value.trim(); if (t) { send({ type: "text", text: t }); $("txt").value = ""; } };
$("stop").onclick = () => send({ type: "cancel" });
const ptt = $("ptt");
ptt.addEventListener("pointerdown", (e) => { ptt.setPointerCapture(e.pointerId); startRec(); });
for (const ev of ["pointerup", "pointercancel"]) ptt.addEventListener(ev, stopRec);
ptt.addEventListener("contextmenu", (e) => e.preventDefault());

const initial = location.hash.slice(1) || localStorage.getItem("pilote-code");
if (initial) { $("code").value = initial; connect(initial); }
</script>
</body>
</html>
